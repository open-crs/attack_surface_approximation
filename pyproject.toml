[project]
name = "attack_surface_approximation"
version = "0.1.0"
description = "Module for approximating the attack surface of an executable"
authors = [{ name = "OpenCRS" }]
requires-python = ">=3.10,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "commons",
    "pycparser>=2.21,<3",
    "pyelftools>=0.29,<0.30",
    "docker>=6.1.2,<7",
    "rich>=12.5.1,<13",
    "click>=8.1.3,<9",
    "requests==2.31.0",
]

[project.scripts]
attack_surface_approximation = "attack_surface_approximation.cli:main"

[dependency-groups]
dev = [
    "black>=24.3.0,<25",
    "isort>=5.10.1,<6",
    "pylint>=2.14.4,<3",
    "pyproject-flake8>=0.0.1a5,<0.0.2",
    "flake8-annotations>=2.9.1,<3",
]

[tool.uv.sources]
commons = { path = "../commons", editable = false }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pylint.MASTER]
init-hook="import sys; sys.path.append('.')"

[tool.pylint.MESSAGES_CONTROL]
disable="missing-function-docstring, missing-class-docstring, missing-module-docstring"

[tool.flake8]
extend-ignore = "ANN101,"
max-line-length=88
per-file-ignores = """
    ./**/__init__.py: F401
"""

[tool.black]
line-length = 79
preview = true
